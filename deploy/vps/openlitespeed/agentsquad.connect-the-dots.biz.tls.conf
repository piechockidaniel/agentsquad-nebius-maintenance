docRoot                   /var/www/agentsquad-acme-challenge
vhDomain                  agentsquad.connect-the-dots.biz
enableGzip                1
enableBr                  1

index  {
  useServer               0
}

extProcessor agentsquad_host {
  type                    proxy
  address                 http://127.0.0.1:8090
  maxConns                50
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context /.well-known/acme-challenge/ {
  location                /var/www/agentsquad-acme-challenge/.well-known/acme-challenge/
  allowBrowse             1
  accessControl {
    allow                 *
  }
}

context / {
  type                    proxy
  handler                 agentsquad_host
  addDefaultCharset       off
  extraHeaders            <<<END_HEADERS
X-Forwarded-For: %{REMOTE_ADDR}e
X-Forwarded-Proto: https
END_HEADERS
}

module cache {
  ls_enabled              0
}

rewrite  {
  enable                  1
  rules                   <<<END_RULES
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteCond %{HTTPS} off
RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
END_RULES
}

accessLog /usr/local/lsws/logs/agentsquad.connect-the-dots.biz.access.log {
  useServer               0
  rollingSize             10M
  keepDays                30
  compressArchive         1
}

errorLog /usr/local/lsws/logs/agentsquad.connect-the-dots.biz.error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
  keepDays                30
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/agentsquad.connect-the-dots.biz/privkey.pem
  certFile                /etc/letsencrypt/live/agentsquad.connect-the-dots.biz/fullchain.pem
  certChain               1
  sslSessionCache         1
  sslSessionTickets       1
  enableSpdy              15
  enableQuic              1
}
