<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentSquad</title><style>body{max-width:820px;margin:3rem auto;padding:0 1rem;font:16px system-ui;background:#10131a;color:#e7ecf4}button,input{padding:.6rem 1rem}input{min-width:280px}pre{white-space:pre-wrap;background:#1b2230;padding:1rem;border-radius:8px}.status{font-weight:700}</style></head><body>
<h1>AgentSquad</h1><p>Autonomous dependency repair in Nebius Token Factory Sandboxes.</p>
<label for="access">Console access token</label><br><input id="access" type="password" autocomplete="current-password" placeholder="Required on a deployed VM"><p><button id="refresh">Check Nebius preflight</button> <button id="run">Run sandbox repair</button></p><p class="status" id="status">Not checked</p><pre id="evidence">No run selected.</pre>
<script>
const out=document.querySelector('#evidence'), status=document.querySelector('#status');
const access=document.querySelector('#access'); access.value=sessionStorage.getItem('agentsquad-access-token')||''; access.oninput=()=>sessionStorage.setItem('agentsquad-access-token',access.value);
async function api(path,method='GET'){const headers={'Content-Type':'application/json'};if(access.value)headers['X-AgentSquad-Access-Token']=access.value;const r=await fetch(path,{method,headers});if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||`HTTP ${r.status}`);return r.json()}
async function refresh(){try{const p=await api('/maintenance/preflight');status.textContent=p.ready?'Preflight ready':'Preflight not ready';out.textContent=JSON.stringify(p,null,2)}catch(e){status.textContent=e.message}}
async function show(id){const run=await api('/maintenance/runs/'+id);status.textContent=`${run.status}: ${run.phase}`;out.textContent=JSON.stringify(run,null,2);if(!['Remediated','Blocked','Failed'].includes(run.status))setTimeout(()=>show(id),1200)}
document.querySelector('#refresh').onclick=refresh;document.querySelector('#run').onclick=async()=>{try{const r=await api('/maintenance/runs','POST');show(r.id)}catch(e){status.textContent=e.message}};
</script></body></html>
